<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detalhes do Animal — Redirecionando…</title>
  <meta http-equiv="refresh" content="0; url=index.html#animal">
</head>
<body>
  <p>Redirecionando para a página de detalhes — se o redirecionamento não funcionar, <a id="jslink" href="index.html#animal">clique aqui</a>.</p>
  <script>
    // Preserve querystring (ex: ?id=3) and forward to SPA hash route
    (function(){
      try {
        var qs = window.location.search || '';
        var target = 'index.html#animal' + (qs ? '?' + qs.replace(/^\?/, '') : '');
        window.location.replace(target);
      } catch (e) {
        document.getElementById('jslink').style.display = 'inline';
      }
    })();
  </script>
</body>
</html>
